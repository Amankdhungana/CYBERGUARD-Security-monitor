{% extends "base.html" %}

{% block title %}Employee Login{% endblock %}

{% block content %}
<div class="login-container">
    <h2 style="text-align: center; margin-bottom: 2rem;">Employee Portal</h2>
    <form method="POST" action="{{ url_for('auth.employee_login') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">Sign In</button>
    </form>
    <p style="text-align: center; margin-top: 1rem; font-size: 0.875rem; color: var(--text-light);">
        Demo credentials: Any employee username / Employee@123
    </p>
</div>
{% endblock %}
