{% extends "base.html" %}

{% block title %}Access Denied{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem;">
    <h1 style="font-size: 4rem; color: var(--danger);">403</h1>
    <h2>Access Denied</h2>
    <p>You do not have permission to access this resource.</p>
    <p>This incident has been logged and will be reviewed by security.</p>
    <a href="{{ url_for('home') }}" class="btn-primary" style="margin-top: 2rem; display: inline-block;">Return to Home</a>
</div>
{% endblock %}
